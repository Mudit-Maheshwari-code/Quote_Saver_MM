<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mini Quote Saver</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #0d0d0d;
            color: #e6e6e6;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
        }

        h1 {
            margin-top: 20px;
        }

        .input-area {
            margin-top: 20px;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        input {
            padding: 10px;
            width: 250px;
            border: none;
            border-radius: 5px;
            outline: none;
            background: #081011;
            color: #e6e6e6;
        }

        #addBtn {
            padding: 10px 15px;
            border: none;
            background: #00faff;
            color: #001314;
            border-radius: 5px;
            cursor: pointer;
            margin-left: 10px;
        }

        #clearAllBtn {
            padding: 10px 15px;
            background: #ff7575;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        #quoteBox {
            margin-top: 25px;
            width: 90%;
            max-width: 400px;
            height: 400px;
            overflow-y: auto;
            background: #0f1a1f;
            border-radius: 10px;
            padding: 15px;
        }


        ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        li {
            background: #14232a;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            word-break: break-word;
        }

        .deleteBtn {
            background: #ff4d4d;
            border: none;
            padding: 5px 8px;
            border-radius: 4px;
            cursor: pointer;
            color: white;
        }

        #countText {
            margin-top: 15px;
            font-size: 14px;
            opacity: 0.8;
        }
    </style>
</head>

<body>
    <h1>Mini Quote Saver</h1>

    <div class="input-area">
        <button id="clearAllBtn">Clear All</button>
        <input type="text" id="quoteInput" placeholder="Type a quote..." />
        <button id="addBtn">Add Quote</button>
    </div>

    <p id="countText">Total Quotes: 0</p>

    <div id="quoteBox">
        <ul id="quoteList"></ul>
    </div>

    <script>
        const input = document.getElementById("quoteInput");
        const addBtn = document.getElementById("addBtn");
        const list = document.getElementById("quoteList");
        const countText = document.getElementById("countText");
        const clearAllBtn = document.getElementById("clearAllBtn");

        let quotes = [];
        try {
            quotes = JSON.parse(localStorage.getItem("quotes")) || [];
        } catch (e) {
            quotes = [];
        }

        function renderQuotes() {
            list.innerHTML = "";
            countText.textContent = `Total Quotes: ${quotes.length}`;

            quotes.forEach((q, index) => {
                const li = document.createElement("li");

                const textDiv = document.createElement("div");
                textDiv.textContent = q;
                textDiv.style.flex = "1";

                const delBtn = document.createElement("button");
                delBtn.className = "deleteBtn";
                delBtn.textContent = "X";
                delBtn.addEventListener("click", () => deleteQuote(index));

                li.appendChild(textDiv);
                li.appendChild(delBtn);
                list.appendChild(li);
            });
        }

        function addQuote() {
            const text = input.value.trim();
            if (text === "") return;
            quotes.push(text);
            localStorage.setItem("quotes", JSON.stringify(quotes));
            input.value = "";
            renderQuotes();
            input.focus();
        }

        function deleteQuote(i) {
            if (i < 0 || i >= quotes.length) return;
            quotes.splice(i, 1);
            localStorage.setItem("quotes", JSON.stringify(quotes));
            renderQuotes();
        }

        clearAllBtn.addEventListener("click", () => {
            if (!quotes.length) return;
            if (confirm("Clear all saved quotes?")) {
                quotes = [];
                localStorage.setItem("quotes", JSON.stringify(quotes));
                renderQuotes();
            }
        });

        addBtn.addEventListener("click", addQuote);

        input.addEventListener("keydown", (e) => {
            if (e.key === "Enter") {
                e.preventDefault();
                addQuote();
            }
        });

        renderQuotes();
    </script>
</body>

</html>
