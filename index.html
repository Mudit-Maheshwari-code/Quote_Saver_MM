<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mini Quote Saver</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #0d0d0d;
      color: #e6e6e6;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100vh;
    }

    h1 {
      margin-top: 20px;
    }

    .input-area {
      margin-top: 20px;
      display: flex;
      gap: 10px;
    }

    input {
      padding: 10px;
      width: 250px;
      border: none;
      border-radius: 5px;
      outline: none;
    }

    button {
      padding: 10px 15px;
      border: none;
      background: #00faff;
      color: #001314;
      border-radius: 5px;
      cursor: pointer;
      margin-left: 10px;
      
    }

    #quoteBox {
      margin-top: 25px;
      width: 90%;
      max-width: 400px;
      height: calc(100vh - 180px);
      overflow-y: auto;
      background: #0f1a1f;
      border-radius: 10px;
      padding: 15px;
    }

    ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    li {
      background: #14232a;
      padding: 10px;
      margin-bottom: 10px;
      border-radius: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .deleteBtn {
      background: #ff4d4d;
      border: none;
      padding: 5px 8px;
      border-radius: 4px;
      cursor: pointer;
      color: white;
    }
  </style>
</head>
<body>
  <h1>Mini Quote Saver</h1>

  <div class="input-area">
    <button id="clearAllBtn" style="padding:10px 15px;background:#ff7575;color:white;border:none;border-radius:5px;cursor:pointer;">Clear All</button>
    <input type="text" id="quoteInput" placeholder="Type a quote..." />
    <button id="addBtn">Add Quote</button>
  </div>

  <p id="countText" style="margin-top:15px;font-size:14px;opacity:0.8;">Total Quotes: 0</p>

  <div id="quoteBox">
    <ul id="quoteList"></ul>
  </div>

  <script>
    const input = document.getElementById("quoteInput");
    const addBtn = document.getElementById("addBtn");
    const list = document.getElementById("quoteList");

    let quotes = JSON.parse(localStorage.getItem("quotes")) || [];

    function renderQuotes() {
      list.innerHTML = "";
      document.getElementById("countText").textContent = `Total Quotes: ${quotes.length}`;
      quotes.forEach((q, index) => {
        const li = document.createElement("li");
        li.innerHTML = `${q} <button class=\"deleteBtn\" onclick=\"deleteQuote(${index})\">X</button>`;
        list.appendChild(li);
      });
    } <button class="deleteBtn" onclick="deleteQuote(${index})">X</button>`;
        list.appendChild(li);
      });
    }

    function addQuote() {
      const text = input.value.trim();
      if (text !== "") {
        quotes.push(text);
        localStorage.setItem("quotes", JSON.stringify(quotes));
        input.value = "";
        renderQuotes();

    document.getElementById("clearAllBtn").addEventListener("click", function() {
      quotes = [];
      localStorage.setItem("quotes", JSON.stringify(quotes));
      renderQuotes();
    });
      }
    }

    function deleteQuote(i) {
      quotes.splice(i, 1);
      localStorage.setItem("quotes", JSON.stringify(quotes));
      renderQuotes();
    }

    addBtn.addEventListener("click", addQuote);

    input.addEventListener("keypress", function (e) {
      if (e.key === "Enter") addQuote();
    });

    renderQuotes();
  </script>
</body>
</html>
